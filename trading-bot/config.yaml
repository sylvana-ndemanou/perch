# Configuration for the triangular arbitrage scanner.
#
# Universe: for every symbol in `altcoins`, the bot watches <ALT>/USDT and
# <ALT>/BTC, plus the single BTC/USDT market that anchors every triangle.
# With the default list that is 25 * 2 + 1 = 51 markets tracked in real time.

quote_asset: USDT
bridge_asset: BTC

altcoins:
  - ETH
  - BNB
  - SOL
  - XRP
  - ADA
  - DOGE
  - AVAX
  - DOT
  - LINK
  - MATIC
  - LTC
  - TRX
  - ATOM
  - UNI
  - ETC
  - XLM
  - ALGO
  - NEAR
  - FIL
  - APT
  - ARB
  - OP
  - SUI
  - INJ
  - FTM

# Taker fee per leg, as a fraction (0.001 = 0.10%). Binance's published
# default spot taker fee is 0.10%; confirm your actual tier (VIP level /
# BNB fee discount) in Account > Fees, since a stale value here will make
# the bot chase opportunities that are not really profitable.
taker_fee: 0.001

# Minimum net profit (after fees on all 3 legs) required before the bot
# will even log/act on an opportunity, as a fraction (0.001 = 0.10%).
# Set well above zero to absorb slippage between detection and execution,
# since the three legs are NOT executed atomically.
min_profit_pct: 0.0015

# Safety limits, enforced by the risk manager regardless of --live/--dry-run.
risk:
  max_trade_usdt: 50.0        # capital committed per triangular trade
  daily_loss_limit_usdt: 25.0 # bot halts new trades once breached
  max_trades_per_hour: 20
  cooldown_seconds: 5.0       # min time before re-trading the same triangle+direction

# How often (seconds) to log a heartbeat / stats summary.
stats_interval_seconds: 30

feed:
  # rest: polls https://api.binance.com/api/v3/ticker/bookTicker (all
  #       symbols in one HTTP call) every `poll_interval_seconds`. Plain
  #       HTTPS on port 443 -- works through most corporate proxies and
  #       firewalls. Default, and the only option verified to work from
  #       this project's own restricted sandbox.
  # ws:   subscribes to Binance's combined bookTicker WebSocket stream
  #       (port 9443) for true push-based, sub-second updates. Faster,
  #       but blocked by some networks/proxies that only allow ordinary
  #       HTTPS -- use where available.
  # mock: generates a synthetic in-process feed with no network calls at
  #       all, for offline testing of the bot's own logic.
  type: rest
  poll_interval_seconds: 1.0
